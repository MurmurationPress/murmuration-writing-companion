name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Verify release metadata and assets
        run: npm run release:check

      - name: Record candidate asset checksums
        run: node --input-type=module -e "import {writeFile} from 'node:fs/promises'; import {releaseChecksums} from './scripts/release-assets.mjs'; await writeFile('SHA256SUMS', await releaseChecksums('.'));"

      - name: Upload exact-commit candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: mwc-${{ github.sha }}-${{ matrix.os }}
          path: |
            main.js
            manifest.json
            styles.css
            SHA256SUMS
          if-no-files-found: error
